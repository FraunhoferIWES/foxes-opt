# -----------
# foxes setup
# -----------

engine:
  engine_type: process
  chunk_size_states: 400
  verbosity: 0

states:
  states_type: ScanStates
  scans:
    WS: [4, 6, 8, 10]
    WD: [0, 45, 90, 135, 180, 225, 270, 315]
    TI: [0.05]
    RHO: [1.225]

wind_farm:
  layouts:
    - function: add_grid
      steps: [3, 3]
      xy_base: [0.0, 0.0]
      step_vectors: [[1300.0, 0], [0, 1300.0]]
      turbine_models: [opt_yawm, yawm2yaw, NREL5MW]   # Notice the opt_yawm model

algorithm:
  algo_type: Downwind
  wake_models: ["Bastankhah2016_linear_k1_02", "CrespoHernandez_quadratic_k1_04"]
  wake_deflection: JimenezProj

# ------------------
# optimization setup
# ------------------

optimization:
  problem:
    name: opt_yawm                    # Name of the turbine model, wind_farm section
    problem_type: OptFarmVars         # Name of the optimization problem class
    functions:                        # The following functions are called before init
      - name: add_var                 # For this problem we need to add an opt variable
        variable: YAWM
        typ: float
        init: 0.0
        min: -30.0
        max: 30.0
        level: state-turbine          # one variable per state and turbine
    objectives:                       # add all objectives here to the list
      - objective_type: MaxFarmPower
    # constraints can be added here similarly

  optimizer:
    family: pymoo
    optimizer: GA
    vectorize: True
    pop_size: 100
    seed: 42
    termination: iterations
    max_iterations: 100

# -------
# outputs
# -------

outputs:

  # write results to netCDF file:
  - output_type: SingleObjResultsWriter
    to_file: results.nc

  # Create a rather complex plot and save it:
  - output_type: plt
    with_engine: true
    functions:
      - function: figure
        figsize: [9, 9]
        result_labels: $fig
  - object: $fig
    with_engine: true
    functions:
      - function: add_subplot
        args: [2, 2, 1]
        result_labels: $ax1
      - function: add_subplot
        args: [2, 2, 2]
        polar: True
        result_labels: $ax2
      - function: add_subplot
        args: [2, 2, 3]
        polar: True
        result_labels: $ax3
      - function: add_subplot
        args: [2, 2, 4]
        polar: True
        result_labels: $ax4
  - output_type: FarmLayoutOutput
    parameters:
      fig: $fig
      ax: $ax1
  - output_type: RosePlotOutput
    turbine: 4
    ws_var: AMB_REWS
    ws_bins: [0, 3, 5, 7, 9, 11]
    wd_sectors: 8
    plot_pars:
      title: Wind rose
      fig: $fig
      ax: $ax2
  - output_type: WindRoseBinPlot
    turbine: 0
    variable: YAWM
    ws_bins: [0, 3, 5, 7, 9, 11]
    wd_sectors: 8
    contraction: mean_no_weights
    plot_pars:
      title: Turbine 0
      cmap: PuOr
      vmin: -30
      vmax: 30
      fig: $fig
      ax: $ax3
  - output_type: WindRoseBinPlot
    turbine: 8
    variable: YAWM
    ws_bins: [0, 3, 5, 7, 9, 11]
    wd_sectors: 8
    contraction: mean_no_weights
    plot_pars:
      title: Turbine 8
      cmap: PuOr
      vmin: -30
      vmax: 30
      fig: $fig
      ax: $ax4
  - output_type: plt
    functions:
      - function: savefig
        fname: result.png
      - function: show
      - function: close
